<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Elektrizitätsbilanz und normative Allokation</title>
<desc id="desc">Drei getrennte Ebenen: belegte Stromflüsse, offene Allokationsregeln und virtuelle Primärenergiegutschrift. Nicht maßstäblich.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536777"/></marker></defs>
<rect width="1200" height="650" fill="white"/>
<g font-family="Arial, sans-serif" fill="#243746">
<text x="36" y="40" font-size="25" font-weight="bold">Von Szenariodaten zu einer neuen Mobilitätsgutschrift</text>
<text x="36" y="70" font-size="16">Modellstruktur · nicht maßstäblich · offene Parameter bleiben ohne Zahlenwert</text>
<rect x="25" y="95" width="1150" height="155" rx="8" fill="#edf6f7"/>
<text x="45" y="125" font-size="18" font-weight="bold">1  Physische Elektrizitätsbilanz · PJ_el/a · veröffentlichte Szenariodaten</text>
<rect x="45" y="150" width="275" height="75" rx="5" fill="white" stroke="#007c83"/>
<text x="60" y="178" font-size="17">Erzeugung nach Technologie</text><text x="60" y="204" font-size="16">Nettoimporte / Nettoexporte</text>
<rect x="430" y="150" width="235" height="75" rx="5" fill="white" stroke="#007c83"/>
<text x="455" y="192" font-size="18">Stromsystem Österreich</text>
<rect x="770" y="150" width="380" height="75" rx="5" fill="white" stroke="#007c83"/>
<text x="790" y="178" font-size="17">Sektoraler Strombedarf</text><text x="790" y="204" font-size="16">Energiebranche, Verluste, Umwandlung</text>
<path d="M320 187 H425 M665 187 H765" fill="none" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="275" width="1150" height="155" rx="8" fill="#fff6e5"/>
<text x="45" y="305" font-size="18" font-weight="bold">2  Normative Stromzuordnung · PJ_el/a · zusätzliche Entscheidungen erforderlich</text>
<rect x="45" y="330" width="275" height="75" rx="5" fill="white" stroke="#ad7420"/>
<text x="60" y="358" font-size="17">Zentrale / dezentrale Anteile</text><text x="60" y="384" font-size="16">PV-Anteile und Berechtigung offen</text>
<rect x="430" y="330" width="235" height="75" rx="5" fill="white" stroke="#ad7420"/>
<text x="450" y="358" font-size="17">Priorisierte Zuordnung</text><text x="450" y="384" font-size="16">MIV / übriger Verkehr offen</text>
<rect x="770" y="330" width="380" height="75" rx="5" fill="white" stroke="#ad7420"/>
<text x="790" y="358" font-size="17">Verfügbarer Saldo für Mobilität</text><text x="790" y="384" font-size="16">Kein Zahlenwert ohne Zuordnungsregel</text>
<path d="M320 367 H425 M665 367 H765" fill="none" stroke="#536777" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="25" y="455" width="1150" height="155" rx="8" fill="#f3eef7"/>
<text x="45" y="485" font-size="18" font-weight="bold">3  Virtuelle Gutschrift · Primärenergie · eigenständige Bewertungsebene</text>
<rect x="45" y="510" width="275" height="75" rx="5" fill="white" stroke="#82539a"/>
<text x="60" y="538" font-size="17">Saldo und Primärenergiefaktoren</text><text x="60" y="564" font-size="16">Zeitliche Bewertung gesondert</text>
<rect x="430" y="510" width="235" height="75" rx="5" fill="white" stroke="#82539a"/>
<text x="450" y="538" font-size="17">Mobilitätsbudget</text><text x="450" y="564" font-size="16">PJ_PE/a</text>
<rect x="770" y="510" width="380" height="75" rx="5" fill="white" stroke="#82539a"/>
<text x="790" y="538" font-size="17">Nutzungsbezogene Gutschrift</text><text x="790" y="564" font-size="16">kWh PE/(m² NGF a)</text>
<path d="M320 547 H425 M665 547 H765" fill="none" stroke="#536777" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="36" y="635" font-size="15">Legacy 2023 bleibt gültig. Transition 2040: laufende Rekalibrierung, keine neue Gutschrift festgelegt.</text>
</g></svg>
