profile:
  default: intern

project:
  type: book
  output-dir: _book
  resources:
    - Abbildungen/methodik/**
    - Abbildungen/praxis/**
    - Abbildungen/transition_sankey.html
    - Abbildungen/mobilitaetsbudget_sankey.html
    - "!Redaktion/**"
    - "!.local/**"
    - "!Berechnungen/**"

lang: de
bibliography: references.bib

comments:
  hypothesis:
    theme: clean
    openSidebar: false
    
book:
  title: "Klimaneutrale Plus-Energie-Quartiere"
  subtitle: "Wissenschaftliche Grundlagen des klimaaktiv Standards – Arbeitsfassung"
  date: "2026-10-14"

  chapters:
    - index.qmd
    - part: "Nutzen und Anwendung"
      chapters:
        - Kapitel/01-einführung.qmd
        - Kapitel/07-renovierungsfahrplan.qmd
    - part: "Praxisbeispiele"
      chapters:
        - Kapitel/07-praxisbeispiele.qmd
        - Kapitel/07-am-bichl.qmd
        - Kapitel/07-ruginnovation.qmd
        - Kapitel/07-campo-breitenlee.qmd
    - Kapitel/02-standard.qmd
    - Kapitel/07-anwendung.qmd
    - part: "Wissenschaftliche Grundlagen"
      chapters:
        - Kapitel/03-methodik.qmd
        - Kapitel/03-zielszenario.qmd
        - Kapitel/03-allokation.qmd
        - Kapitel/03-gebaeudebestand.qmd
        - Kapitel/05-kontextfaktoren.qmd
        - Kapitel/05-kontext-mobilitaet.qmd
        - Kapitel/05-kontext-sanierung.qmd
        - Kapitel/03-zielwert-thg.qmd
        - Kapitel/04-bilanzregeln.qmd
        - Kapitel/07-ergebnisse.qmd
        - Kapitel/08-fortschreibung.qmd
    - Kapitel/07-einstieg.qmd
    - references.qmd
    - about.qmd
  appendices:
    - Kapitel/anhang-szenariotabellen.qmd
    - Kapitel/anhang-methodenstand.qmd
    - Berechnungen/gfz_at/GFZ_AT_Analyse_Anhang.ipynb
    - Berechnungen/sektorenmodell/allokation.ipynb
    - Berechnungen/gebaeudesektormodell/Gebaeudesektormodell.ipynb
    - Kapitel/anhang-quartiersbilanzierung.qmd


    
  search: true
  sidebar:
    collapse-level: 1
  navbar:
    left:
      - {href: index.qmd, text: "Überblick"}
      - {href: Kapitel/07-praxisbeispiele.qmd, text: "Praxisbeispiele"}
      - {href: Kapitel/07-einstieg.qmd, text: "Einstieg und Kontakt"}
      - text: "PEExcel-Nachweistool"
        href: https://simonschaluppe.github.io/peexcel/
        target: _blank
    right:
      - {href: files/Klimaneutrale-Plus-Energie-Quartiere.docx, text: Download, icon: download}


format:
  html:
    theme: cosmo
    css: styles/presets.css
    toc: true
    toc-depth: 3
    number-sections: false
    number-depth: 1
    collapse-level: 1
    link-external-newwindow: true
  pdf:
    documentclass: scrreprt
    papersize: a4
    pdf-engine: lualatex
    toc: true
    number-sections: true
    colorlinks: true
  docx:
    toc: true
    toc-depth: 3
    toc-title: Inhaltsverzeichnis
    number-sections: true
    syntax-highlighting: github

execute:
  echo: false
